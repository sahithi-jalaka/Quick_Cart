{% extends "base.html" %}
{% block title %}Login · Quick Cart{% endblock %}
{% block content %}
<div class="form-card"><h2>Welcome back</h2>
<form method="post">
  <label>Email</label><input type="email" name="email" required>
  <label>Password</label><input type="password" name="password" required>
  <button class="btn" type="submit">Login</button>
</form><p>New to Quick Cart? <a href="{{ url_for('register') }}">Create an account</a></p></div>
{% endblock %}
